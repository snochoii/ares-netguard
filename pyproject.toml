[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-netguard"
version = "0.1.0"
description = "Local-first Experimental AI-NDR Workstation research package"
requires-python = ">=3.11"
dependencies = [
  "pyod==3.6.1",
  "river==0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
foundation-forecast = [
  "accelerate==1.14.0",
  "chronos-forecasting==2.3.1",
  "einops==0.8.2",
  "huggingface-hub==1.21.0",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "torch==2.12.1+cpu",
  "transformers==5.12.1",
]

[tool.setuptools.package-data]
"ares_netguard.models.manifests" = ["*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
